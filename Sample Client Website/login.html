<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeaksPrehab Login</title>

    <!-- CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.css">
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-md navbar-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-white ps-2" href="1splash.html">PeaksPrehab</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="collapsibleNavbar">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="1splash.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="2resourcehub.html">Resources</a></li>
                    <li class="nav-item"><a class="nav-link" href="3coaching.html">Coaching</a></li>
                    <li class="nav-item"><a class="nav-link" href="extra-resources.html">External Links</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <section class="hero-section bg-light rounded-4 p-4 p-lg-5 shadow-sm">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="bg-white rounded-4 p-4 p-md-5">
                        <h1 class="h2 fw-bold mb-3 text-center">Member Login</h1>
                        <p class="text-center text-muted mb-4">Sign in to access your recovery plans, coaching dashboard, and resources.</p>
                        <form action="#" method="get">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">Log In</button>
                            </div>
                        </form>
                        <p class="small text-center text-muted mt-4 mb-0">This is a demo page. The form does not connect to a backend yet.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="page-footer">
        <p class="mb-0 small">&copy; 2026 Peaks Prehab. All rights reserved.</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/2.11.8/umd/popper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
</body>
</html>
